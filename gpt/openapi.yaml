openapi: 3.1.0
info:
  title: SiteProof Audit, Remediation & Artifact API
  version: 0.3.0
servers:
  - url: https://YOUR-SITEPROOF-DOMAIN.example
paths:
  /api/audit/site:
    post:
      operationId: auditSite
      summary: Crawl and audit a public website
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, format: uri}
                maxPages: {type: integer, minimum: 1, maximum: 150, default: 50}
      responses:
        '200': {description: Audit result}
  /api/audit/page:
    post:
      operationId: auditPage
      summary: Audit one public webpage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, format: uri}
      responses:
        '200': {description: Page audit result}
  /api/remediation:
    post:
      operationId: planRemediation
      summary: Turn audit findings into a prioritized implementation-ready fix plan and optional downloadable Fix Pack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: Website to audit before planning when auditData is not supplied.
                auditData:
                  type: object
                  additionalProperties: true
                  description: Existing SiteProof canonical audit object. Prefer this when the audit is already prepared.
                maxPages: {type: integer, minimum: 1, maximum: 150, default: 50}
                includeInformational: {type: boolean, default: true}
                maxItems: {type: integer, minimum: 1, maximum: 500, default: 500}
                formats:
                  type: array
                  description: Optional Fix Pack artifact formats. Leave empty for plan JSON only.
                  items: {type: string}
                  default: []
                template:
                  type: string
                  enum: [detailed-audit, executive-summary, client-report, raw]
                  default: client-report
                pageSize: {type: string, enum: [A4, LETTER], default: A4}
                orientation: {type: string, enum: [portrait, landscape], default: portrait}
                filenamePrefix: {type: string}
                bundleFormats:
                  type: array
                  items: {type: string}
                branding:
                  type: object
                  properties:
                    companyName: {type: string}
                    clientName: {type: string}
                    preparedBy: {type: string}
                    reportTitle: {type: string}
                    confidentialityLabel: {type: string}
              anyOf:
                - required: [url]
                - required: [auditData]
      responses:
        '200': {description: Remediation plan with optional generated Fix Pack artifacts}
  /api/audit-to-action:
    post:
      operationId: auditToAction
      summary: Audit a website, build prioritized solutions, and generate a Fix Pack in one workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, format: uri}
                maxPages: {type: integer, minimum: 1, maximum: 150, default: 50}
                includeInformational: {type: boolean, default: true}
                maxItems: {type: integer, minimum: 1, maximum: 500, default: 500}
                formats:
                  type: array
                  items: {type: string}
                  default: [pdf, xlsx, docx]
                branding:
                  type: object
                  properties:
                    companyName: {type: string}
                    clientName: {type: string}
                    preparedBy: {type: string}
                    reportTitle: {type: string}
                    confidentialityLabel: {type: string}
      responses:
        '200': {description: Canonical audit, remediation plan, and generated Fix Pack artifacts}
  /api/export/formats:
    get:
      operationId: listExportFormats
      summary: List installed SiteProof artifact formats
      responses:
        '200': {description: Supported export formats}
  /api/export:
    post:
      operationId: exportAudit
      summary: Generate downloadable audit files from a website or canonical audit data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: Website to audit before export when auditData is not supplied.
                maxPages: {type: integer, minimum: 1, maximum: 150, default: 50}
                auditData:
                  type: object
                  additionalProperties: true
                  description: Previously prepared SiteProof audit object. Use this to export without rerunning the audit.
                formats:
                  type: array
                  minItems: 1
                  items: {type: string}
                  default: [pdf, xlsx, docx]
                template:
                  type: string
                  enum: [detailed-audit, executive-summary, client-report, raw]
                  default: detailed-audit
                pageSize:
                  type: string
                  enum: [A4, LETTER]
                  default: A4
                orientation:
                  type: string
                  enum: [portrait, landscape]
                  default: portrait
                filenamePrefix: {type: string}
                bundleFormats:
                  type: array
                  items: {type: string}
                branding:
                  type: object
                  properties:
                    companyName: {type: string}
                    clientName: {type: string}
                    preparedBy: {type: string}
                    reportTitle: {type: string}
                    confidentialityLabel: {type: string}
              anyOf:
                - required: [url]
                - required: [auditData]
      responses:
        '200':
          description: Generated artifacts with temporary download URLs
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
security:
  - bearerAuth: []
