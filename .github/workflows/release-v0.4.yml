name: Release SiteProof v0.4

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
      - 'skills/**'
      - 'gpt/**'
      - 'knowledge/**'
      - 'README.md'
      - 'RELEASE_NOTES_v0.4.0.md'
      - '.github/workflows/release-v0.4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    if: github.repository == 'jmqbataller/SiteProof'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=SiteProof-v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Build source ZIP
        shell: bash
        run: |
          ZIP="${{ steps.version.outputs.zip }}"
          zip -r "$ZIP" . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'node_modules/*' \
            -x '*.zip' \
            -x '.env' \
            -x '.DS_Store'

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.version.outputs.zip }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing ZIP asset."
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "SiteProof $TAG — Fix Mode" \
              --notes-file RELEASE_NOTES_v0.4.0.md
          fi
